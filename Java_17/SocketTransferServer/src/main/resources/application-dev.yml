server:
  port: ${env.port.sts.api}
  tomcat:
    max-connections: 4 # max-threads(最大线程数) + accept-count(等待队列)
    accept-count: 2
    connection-timeout: 5S
    threads:
      min-spare: 1 # 最小空闲线程数
      max: 2 # 最大线程数，数值范围：2 x CPU Cores + 1 (纯CPU计算型) 或 3 x CPU Cores + 1 (I/O密集型)
#  ssl:
#    # 填写jks-password.txt文件内的密码
#    key-store-password: 123456
#    # JKS格式证书密钥库类型,PFX格式的证书密钥库类型为PKCS12
#    key-store-type: JKS
#    # 您需要使用实际的证书名称替换keystore.jks
#    key-store: classpath:keystore.jks

spring:
  application:
    name: STS_DEV

# IP and port configuration
env:
  ip:
    sts: 192.168.0.221
    tyjw: 192.168.0.222
    jikupi: 192.168.14.120
  port:
    sts:
      api: 20240
      web_socket_server: 20241
      udp: 20242
      mqtt: 1883
    tyjw:
      api: 12000
      tcp: 13002
    jikupi:
      api: 8000
