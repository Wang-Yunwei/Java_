# application.yml

# 通用配置 (所有环境生效)
server:
  port: ${mdtg.ip}
  servlet:
    context-path: /mdtg_robot_server
  # Tomcat 容器优化
  tomcat:
    uri-encoding: UTF-8 # 请求/响应编码
    threads: # 线程池配置: 避免默认值过高导致线程上下文切换开销过大
      max: 200      # 生产环境通常 200-500 足够, 1000 容易导致 CPU 上下文切换风暴
      min-spare: 10 # 降低最小空闲线程, 节省资源
    # 连接相关优化
    accept-count: 100   # 等待队列长度, 当所有线程忙时, 排队的请求个数
    max-connections: 8192 # 最大连接数, 超过此数的连接将被拒绝
    # 安全: 隐藏版本信息
    basedir: /tmp/tomcat # 指定工作目录, 避免使用默认的临时目录可能带来的权限问题

  # HTTP/HTTPS 配置（如果使用 HTTPS）
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: secret
  #   key-store-type: PKCS12
spring:
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB    # 建议减小单文件大小，防止 OOM
      max-request-size: 10MB # 建议减小总请求大小
      enabled: true
      # 临时文件存储位置（防止系统 TMP 目录空间不足）
      location: /tmp/uploads

# 一个增强版的 Swagger UI,用于生成 API 文档
knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

# Mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml # 指定 Mapper XML 文件的位置
  typeAliasesPackage: xiaozhi.modules.*.entity # 实体类别名包扫描路径
  global-config: # 全局配置
    banner: false # 启动时关闭 MyBatis Plus 的 Logo 打印
    db-config:
      id-type: assign_id # 主键类型：使用雪花算法生成 ID (推荐)
  configuration: # MyBatis 原生核心配置
    map-underscore-to-camel-case: true # 开启自动驼峰命名规则映射
    cache-enabled: false # 关闭二级缓存 (分布式环境下建议关闭，避免数据不一致)
    call-setters-on-nulls: true # 当查询结果为 null 时，MyBatis 会自动调用 Setter 方法 (防止 DTO 中 null 值不返回)
    jdbc-type-for-null: null # 将 null 值作为 JDBC 的 NULL 传递，而不是 "null" 字符串

# 定义通用配置模板
common-datasource: &common-mysql
  druid:
    # --- 数据库连接配置 ---
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mdtg.ip}:3306/mdtg_robot_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&allowMultiQueries=true
    username: mdtg # 建议使用环境变量
    password: mdtg@123 # 建议使用环境变量
    # 如果使用了 Jasypt 加密，密码可以写成 ENC(加密串)

    # --- 连接池大小配置 ---
    initial-size: 10
    max-active: 20 # 生产环境建议降低，防止数据库连接数被打满
    min-idle: 10
    max-wait: 6000

    # --- 连接有效性检测 ---
    # 建议开启 test-on-borrow 或使用 validation-query，防止获取到失效连接
    test-on-borrow: true
    # validation-query: SELECT 1 # 如果驱动版本较老，建议显式指定检测 SQL

    # --- PSCache 配置 ---
    pool-prepared-statements: true
    max-pool-prepared-statement-per-connection-size: 20

    # --- 回收器配置 ---
    # 建议缩短回收运行间隔，及时清理无效连接
    time-between-eviction-runs-millis: 30000 # 30秒一次
    min-evictable-idle-time-millis: 60000 # 空闲1分钟后可被回收
    test-while-idle: true

    # --- 监控配置 (关键优化) ---
    stat-view-servlet:
      enabled: true # 建议开启，方便排查慢SQL和连接泄漏
      url-pattern: /druid/*
      # 生产环境务必配置登录账号密码，防止未授权访问
      login-username: admin
      login-password: YourStrongPassword123!

    # --- 过滤器配置 ---
    filter:
      stat:
        log-slow-sql: true
        slow-sql-millis: 1000
        merge-sql: true # 建议开启，便于统计同一类SQL的性能
      wall:
        config:
          # 生产环境建议关闭多语句执行，防止SQL注入风险
          multi-statement-allow: false

common-redis: &common-redis
  redis:
    host: ${mdtg.ip} # Redis 服务器地址
    port: 6379 # Redis 服务器端口
    password: your-strong-password-here # 密码（默认为空，生产环境务必设置强密码）
    database: 0 # 数据库索引（默认为0，建议生产环境不同应用使用不同 DB 或不同实例）
    timeout: 5000ms # 连接超时时间（建议设置较短的连接超时，避免线程堆积）
    lettuce: # Lettuce 客户端配置
      shutdown-timeout: 100ms # 关闭超时时间(通常不需要太长)
      pool:
        max-active: 20 # 连接池最大连接数（生产环境建议适当调大，避免高并发时拿不到连接）
        max-wait: 5000ms # 连接池最大阻塞等待时间（当连接数达到 max-active 时，请求连接的客户端最多等待多久）
        max-idle: 10 # 连接池中的最大空闲连接（保持一定数量的空闲连接，减少频繁创建开销）
        min-idle: 2 # 连接池中的最小空闲连接（建议保持至少1-2个，避免冷启动）

